# rh_aglt — rl_games PPO (LSTM). 두 형제 트랙이 같이 쓴 값(09.29 조사):
#   cup_grasp(DG5F-M-S, cg_r_i10 resolved agent.yaml) 과 pour_bi_rh f01~f04 launch override 가 일치한다.
# 차원은 env 가 정한다(여기 적지 않는다).

params:
  seed: 42

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [1024, 1024, 512, 512]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None
    rnn:
      name: lstm
      units: 1024
      layers: 1
      before_mlp: True
      layer_norm: True
      concat_input: False
      concat_output: False

  load_checkpoint: False
  load_path: ''

  config:
    name: rh_aglt-lstm
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: True
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    num_actors: -1
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 1e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.016
    score_to_win: 100000000
    max_epochs: 20000
    save_best_after: 100
    save_frequency: 200     # 09.29 사용자: pth 저장 간격 200 epoch
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.1
    horizon_length: 16
    minibatch_size: 16384
    mini_epochs: 2
    critic_coef: 4
    clip_value: True
    seq_length: 16
    # ★rl_games 는 'bound' | 'regularisation'(영국식) — 오타는 조용히 b_loss=0 (08.21)
    bound_loss_type: bound
    bounds_loss_coef: 0.005
    zero_rnn_on_done: True

    has_central_value: True
    central_value_config:
      normalize_input: True
      normalize_value: True
      value_bootstrap: True
      minibatch_size: 16384
      mini_epochs: 2
      learning_rate: 1e-4
      lr_schedule: adaptive
      kl_threshold: 0.016
      clip_value: True
      e_clip: 0.2
      truncate_grads: True
      network:
        name: actor_critic
        central_value: True
        mlp:
          units: [1024, 1024, 512, 512]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None

    player:
      deterministic: True
      games_num: 100000
      print_stats: True
